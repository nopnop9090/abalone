name: CI

on:
  push:
    branches: [standalone]
    tags: ['v*']
  pull_request:
    branches: [standalone]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  release-build:
    name: Release ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  exe: abalone }
          - { os: macos-latest,   target: aarch64-apple-darwin,      exe: abalone }
          - { os: macos-13,       target: x86_64-apple-darwin,       exe: abalone }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    exe: abalone.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Paket erstellen
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} README.md LICENSE dist/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a ../abalone-${{ matrix.target }}.zip .; else tar czf ../abalone-${{ matrix.target }}.tar.gz .; fi
      - uses: actions/upload-artifact@v4
        with:
          name: abalone-${{ matrix.target }}
          path: abalone-${{ matrix.target }}.*

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
